server:
  title: Online Segment API
  origins:
    - http://localhost:5173
    - http://127.0.0.1:5173

session:
  max_age: 3600
  temp_prefix: online-segment-session

model:
  file: model.joblib
  kind: random_forest
  n_estimators: 200
  max_depth: 10
  max_features: 3
  min_samples_leaf: 2
  class_weight: balanced_subsample
  max_per_class: 10000
  balance_floor: 256
  edge_ratio: 0.5
  edge_quantile: 0.75
  uncertain_threshold: 0.7
  random_state: 0
  n_jobs: -1

feature:
  base_size: 512
  factors: [1.0, 2.0, 4.0]
  hessian_factors: [1.0, 2.0, 4.0]
  log_factors: [2.0, 4.0]
  sigma_min: 0.5
  sigma_max: 32.0
  percentiles: [1.0, 99.0]
  cache_mb: 256

edge:
  radius: 3.0
  steps: 4
  unary: 1.0
  sigma: 0.08

refine:
  file: refine.pt
  base: 8
  dilations: [1, 2, 4]
  threshold: 0.95
  max_total: 10000
  core_scale: 2.0
  pseudo_weight: 0.25
  patch: 256
  batch: 4
  manual_batch: 3
  first_steps: 60
  next_steps: 20
  lr: 0.001
  focal_gamma: 1.5
  ignore: -1

export:
  max_age: 3600
  temp_prefix: online-segment
  colors:
    - [239, 71, 111]
    - [17, 138, 178]
    - [6, 167, 125]
    - [142, 93, 231]
